name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleRelease --no-daemon
      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk MundoKidsOutlet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MundoKidsOutlet-apk
          path: MundoKidsOutlet.apk
      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mundo Kids Outlet (APK ${{ github.run_number }})
          files: MundoKidsOutlet.apk
